<!DOCTYPE html>
<html lang="zh-TW">

        .booking { background: #fff3cd; color: #856404; }
        .contract { background: #cce5ff; color: #004085; }
        .not-found { background: #e2e3e5; color: #383d41; }
        .unknown { background: #e8e0f0; color: #553c9a; }

        .price { font-size: 15px; font-weight: bold; }

        /* 自動補全下拉選單樣式 */
        .autocomplete-wrapper { position: relative; }
        .autocomplete-dropdown {
            position: absolute;

            left: 0;
            right: 0;
            background: white;
            border: 2px solid #667eea;
            border-top: none;
            border-radius: 0 0 12px 12px;

const TABLET_SUFFIX = ['錠', '锭', '碇', '碙'];
const parseCSVLine = line => {
    const result = [];
    let current = '', inQuotes = false;
    for (const c of line) {
        if (c === '"') inQuotes = !inQuotes;
        else if (c === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
        else current += c;
    }
    result.push(current.trim());
    return result;
};
 
// ===== CSV 解析邏輯（含調整後的規格標籤邏輯） =====
const parseCSV = (csvText, source = 'kezhong') => {
    const data = {};
    const skipWords = ['劃', '品名', '單方', '目前', '每日', '實際', '以上', '其他', '預訂', '下單', '交期', '庫存量表', '庫存均', '有庫存', '會缺貨'];
    
    // 追蹤每個直欄群組 (j) 當前所處的分隔列規格狀態，預設值為 '200g'
    const groupSpec = {}; 

    csvText.split('\n').slice(1).forEach(line => {
        const row = parseCSVLine(line);
        for (let j = 0; j < row.length; j += 4) {
            const [name, status, price] = [row[j], row[j+1], row[j+2]];
            if (!name) continue;
            
            const trimmedName = name.trim();

            // 判斷是否遇到規格分隔標頭列，切換該直欄群組往後的規格狀態
            if (trimmedName === "單方100g" || trimmedName === "單方100G") {
                groupSpec[j] = "100g";
                continue;
            } else if (trimmedName === "錠劑") {
                groupSpec[j] = "錠劑";
                continue;
            } else if (trimmedName === "單方200g" || trimmedName === "單方200G" || trimmedName === "複方") {
                groupSpec[j] = "200g";
                continue;
            }

            if (!skipWords.some(w => name.includes(w))) {
                let stockStatus;
                if (status === '有') {
                    stockStatus = '有货';
                } else if (status === '合約') {
                    stockStatus = '合约';
                } else if (status === '低') {
                    stockStatus = '有货';
                } else if (status === '無') {
                    stockStatus = '缺货';
                } else if (status && (status.includes('預') || status.includes('订') || status.includes('定'))) {
                    stockStatus = '預訂';
                } else if (status && status.trim()) {
                    stockStatus = '?';
                } else {
                    stockStatus = '?';
                }
                
                // 規格標籤邏輯：錠劑庫一律標「錠劑」；科中庫一律依當前狀態賦予規格標籤（預設為 200g）
                const spec = source === 'tablet' ? '錠劑' : (groupSpec[j] || '200g');
                data[name] = [stockStatus, price?.replace(/,/g, '') || '時價', spec];
            }
        }
    });
    return data;
};
 
// ===== 科中專用匹配函數 =====
const findBestMatchInKZ = query => {
    if (!query || !Object.keys(DB_KZ).length) return null;
 
    const AMBIGUOUS_TERMS = {
        '茵陳': ['茵陳蒿', '綿茵陳']
    };
    if (AMBIGUOUS_TERMS[query]) {
        const candidates = AMBIGUOUS_TERMS[query].filter(name => DB_KZ[name]);
        if (candidates.length > 1) {
            return { multiCandidate: true, candidates };
        }
        if (candidates.length === 1) {
            const c = candidates[0];
            return { name: c, status: DB_KZ[c][0], price: DB_KZ[c][1], spec: DB_KZ[c][2], corrected: true, fuzzy: true };
        }
    }
 
    if (DB_KZ[query]) {
        return { name: query, status: DB_KZ[query][0], price: DB_KZ[query][1], spec: DB_KZ[query][2], corrected: false, fuzzy: false };
    }
 
    for (const [correct, typos] of Object.entries(TYPO_MAP)) {
        if (query === correct || (Array.isArray(typos) && typos.includes(query))) {
            if (DB_KZ[correct]) {
                const formulaSuffixes = ['湯','散','丸','飲','膏','丹','煎','劑','露','片'];
                const correctIsFormula = formulaSuffixes.some(s => correct.endsWith(s));
                const ambiguous = correctIsFormula && SINGLE_HERB_NAMES.has(query) && query !== correct;
                return { name: correct, status: DB_KZ[correct][0], price: DB_KZ[correct][1], spec: DB_KZ[correct][2], corrected: true, fuzzy: true, original: query, ambiguous };
            }
        }
    }
 
    if (query.length === 2) {
        return null;
    }
 
    if (query.length >= 3) {
        const suffixes = ['丸', '湯', '散', '飲', '膏', '丹', '煎', '劑', '露', '片'];
        for (const suffix of suffixes) {
            const withSuffix = query + suffix;
            if (DB_KZ[withSuffix]) {
                const ambiguous = SINGLE_HERB_NAMES.has(query);
                return { name: withSuffix, status: DB_KZ[withSuffix][0], price: DB_KZ[withSuffix][1], spec: DB_KZ[withSuffix][2], corrected: true, fuzzy: true, original: query, ambiguous };
            }
        }
    }
 
    if (query.length >= 3) {
        const threshold = 0.7;
        const scored = [];
        for (const [name, data] of Object.entries(DB_KZ)) {
            const matchedChars = [...query].filter(c => name.includes(c));
            const score = matchedChars.length / Math.max(query.length, name.length);
            if (score > threshold) scored.push({ name, status: data[0], price: data[1], spec: data[2], score });
        }
        if (scored.length) {
            const maxScore = Math.max(...scored.map(s => s.score));
            const top = scored.filter(s => s.score === maxScore);
            if (top.length === 1) {
                const c = top[0];
                return { name: c.name, status: c.status, price: c.price, spec: c.spec, corrected: true, fuzzy: true };
            }
            return { multiCandidate: true, candidates: top.map(c => c.name) };
        }
    }
 
    return null;
};
 
// ===== 錠劑專用匹配函數 =====
const findBestMatchInTablet = query => {
    if (!query || !Object.keys(DB_TABLET).length) return null;
 
    if (DB_TABLET[query]) return { name: query, status: DB_TABLET[query][0], price: DB_TABLET[query][1], corrected: false, fuzzy: false };
 
    for (const [correct, typos] of Object.entries(TYPO_MAP)) {
        if (query === correct || (Array.isArray(typos) && typos.includes(query))) {
            if (DB_TABLET[correct]) return { name: correct, status: DB_TABLET[correct][0], price: DB_TABLET[correct][1], corrected: true, fuzzy: true };
        }
    }
 
    for (const suffix of ['湯', '散', '丸', '飲', '膏', '丹', '煎', '劑', '露']) {
        if (query.endsWith(suffix)) {
            const tryTablet = query.slice(0, -suffix.length) + TABLET_SUFFIX[0];
            if (DB_TABLET[tryTablet]) return { name: tryTablet, status: DB_TABLET[tryTablet][0], price: DB_TABLET[tryTablet][1], corrected: true, fuzzy: true };
        }
    }
 
    const queryWithoutDing = query.replace(new RegExp(`[${TABLET_SUFFIX.join('')}]$`), '').trim();
    const tabletName = queryWithoutDing + TABLET_SUFFIX[0];
    if (DB_TABLET[tabletName]) return { name: tabletName, status: DB_TABLET[tabletName][0], price: DB_TABLET[tabletName][1], corrected: true, fuzzy: true };
 
    if (query.length >= 3) {
        let best = null, bestScore = 0.7;
        for (const [name, data] of Object.entries(DB_TABLET)) {
            const matchedChars = [...query].filter(c => name.includes(c));
            const score = matchedChars.length / query.length;
            if (score > bestScore) {
                bestScore = score;
                best = { name, status: data[0], price: data[1], corrected: true, fuzzy: true };
            }
        }
        if (best) return best;
    }
 
    return null;
};
 
// ===== 自動補全功能 =====
let autocompleteIndex = -1;
let autocompleteItems = [];
let autocompleteVisible = false;

function initAutocomplete() {
    const textarea = document.getElementById('input');
    textarea.addEventListener('input', handleAutocompleteInput);
    textarea.addEventListener('keydown', handleAutocompleteKeydown);
    textarea.addEventListener('click', () => { hideAutocomplete(); });
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.autocomplete-wrapper')) {
            hideAutocomplete();
        }
    });
}
 
let autocompleteDebounceTimer = null;
 
function handleAutocompleteInput(e) {
    if (autocompleteDebounceTimer) clearTimeout(autocompleteDebounceTimer);
    autocompleteDebounceTimer = setTimeout(() => {
        const textarea = e.target;
        const value = textarea.value;
        const cursorPos = textarea.selectionStart;
        const lines = value.substring(0, cursorPos).split('\n');
        const currentLine = lines[lines.length - 1].trim();
        const cleanLine = currentLine.replace(/[\s\*\-+xX/]*[\d瓶罐包盒顆粒]+$/, '').trim();
        if (cleanLine.length >= 1 && Object.keys(DB_KZ).length > 0) {
            showAutocompleteSuggestions(cleanLine);
        } else {
            hideAutocomplete();
        }
    }, 200);
}
 
function handleAutocompleteKeydown(e) {
    if (!autocompleteVisible) return;
    switch (e.key) {
        case 'ArrowDown':
            e.preventDefault();
            autocompleteIndex = Math.min(autocompleteIndex + 1, autocompleteItems.length - 1);
            updateAutocompleteSelection();
            break;
        case 'ArrowUp':
            e.preventDefault();
            autocompleteIndex = Math.max(autocompleteIndex - 1, 0);
            updateAutocompleteSelection();
            break;
        case 'Enter':
        case 'Tab':
            if (autocompleteIndex >= 0) {
                e.preventDefault();
                selectAutocompleteItem(autocompleteItems[autocompleteIndex]);
            }
            break;
        case 'Escape':
            hideAutocomplete();
            break;
    }
}
 
function showAutocompleteSuggestions(query) {
    const dropdown = document.getElementById('autocompleteDropdown');
    if (!query || query.length < 1) {
        hideAutocomplete();
        return;
    }
 
    const matches = [];
    const isTabletInput = TABLET_SUFFIX.some(c => query.includes(c));
 
    for (const [correct, typos] of Object.entries(TYPO_MAP)) {
        const allNames = [correct, ...(Array.isArray(typos) ? typos : [])];
        if (!allNames.includes(query)) continue;
        if (DB_KZ[correct]) {
            matches.push({ name: correct, status: DB_KZ[correct][0], price: DB_KZ[correct][1], score: 100, matchType: 'typo-exact', dbType: '科中' });
        }
        if (DB_TABLET[correct]) {
            matches.push({ name: correct, status: DB_TABLET[correct][0], price: DB_TABLET[correct][1], score: 100, matchType: 'typo-exact', dbType: '錠劑' });
        }
    }
 
    if (DB_KZ[query]) matches.push({ name: query, status: DB_KZ[query][0], price: DB_KZ[query][1], score: 100, matchType: 'exact', dbType: '科中' });
    if (DB_TABLET[query]) matches.push({ name: query, status: DB_TABLET[query][0], price: DB_TABLET[query][1], score: 100, matchType: 'exact', dbType: '錠劑' });
 
    if (isTabletInput && !SINGLE_HERB_NAMES.has(query)) {
        for (const suffix of ['湯','散','丸','飲','膏','丹','煎','劑','露']) {
            if (query.endsWith(suffix)) {
                const tryTablet = query.slice(0, -suffix.length) + '錠';
                if (DB_TABLET[tryTablet] && !matches.some(m => m.name === tryTablet)) {
                    matches.push({ name: tryTablet, status: DB_TABLET[tryTablet][0], price: DB_TABLET[tryTablet][1], score: 95, matchType: 'suffix-convert', dbType: '錠劑' });
                }
                break;
            }
        }
    }
 
    for (const [name, data] of Object.entries(DB_KZ)) {
        if (matches.some(m => m.name === name)) continue;
        if (name.includes(query) || query.includes(name)) {
            matches.push({ name, status: data[0], price: data[1], score: 80, matchType: 'contains', dbType: '科中' });
        }
    }
 
    for (const [name, data] of Object.entries(DB_TABLET)) {
        if (matches.some(m => m.name === name)) continue;
        if (name.includes(query) || query.includes(name)) {
            matches.push({ name, status: data[0], price: data[1], score: 80, matchType: 'contains', dbType: '錠劑' });
        }
    }
 
    if (query.length >= 3) {
        const allKZ = Object.entries(DB_KZ);
        const allTab = Object.entries(DB_TABLET);
        for (const [name, data] of allKZ) {
            if (matches.some(m => m.name === name)) continue;
            const matchedChars = [...query].filter(c => name.includes(c));
            const score = Math.round((matchedChars.length / query.length) * 80);
            if (score >= 40) matches.push({ name, status: data[0], price: data[1], score, matchType: 'fuzzy', dbType: '科中' });
        }
        for (const [name, data] of allTab) {
            if (matches.some(m => m.name === name)) continue;
            const matchedChars = [...query].filter(c => name.includes(c));
            const score = Math.round((matchedChars.length / query.length) * 80);
            if (score >= 40) matches.push({ name, status: data[0], price: data[1], score, matchType: 'fuzzy', dbType: '錠劑' });
        }
    }
 
    const dedupMap = new Map();
    for (const m of matches) {
        if (!dedupMap.has(m.name) || m.score > dedupMap.get(m.name).score) {
            dedupMap.set(m.name, m);
        }
    }
 
    matches.length = 0;
    matches.push(...dedupMap.values());
 
    matches.sort((a, b) => {
        const aStartsWith = a.name.startsWith(query) ? 0 : 1;
        const bStartsWith = b.name.startsWith(query) ? 0 : 1;
        if (aStartsWith !== bStartsWith) return aStartsWith - bStartsWith;
        const stockRank = (s) => s === '有货' ? 0 : s === '合约' ? 1 : s === '預訂' ? 2 : s === '缺货' ? 4 : 3;
        const rankA = stockRank(a.status);
        const rankB = stockRank(b.status);
        if (rankA !== rankB) return rankA - rankB;
        return b.score - a.score;
    });
 
    const topMatches = matches.slice(0, 48);
 
    if (topMatches.length === 0) {
        dropdown.innerHTML = '<div class="autocomplete-empty">無匹配項目</div>';
        dropdown.classList.add('show');
        autocompleteVisible = true;
        autocompleteItems = [];
        autocompleteIndex = -1;
        return;
    }
 
    dropdown.innerHTML = topMatches.map((item, index) => {
        const stockClass = item.status === '有货' ? 'in-stock' : item.status === '合约' ? 'contract' : item.status === '預訂' ? 'booking' : 'out-stock';
        const stockText = item.status === '有货' ? '✅ 有貨' : item.status === '合约' ? '📋 合約' : item.status === '預訂' ? '⏳ 預訂' : '⚠️ 缺貨';
        const dbClass = item.dbType === '科中' ? 'db-kz' : 'db-tablet';
        const fuzzyBadge = item.score < 100 ? '<span class="fuzzy-badge">❓ 有疑問</span>' : '';
        return `
            <div class="autocomplete-item" data-index="${index}" data-name="${item.name}">
                <span class="match-text">
                    <span class="db-tag ${dbClass}">${item.dbType}</span>
                    ${highlightMatch(item.name, query)}${fuzzyBadge}
                </span>
                <span class="stock-hint ${stockClass}">${stockText}</span>
            </div>
        `;
    }).join('');
 
    dropdown.querySelectorAll('.autocomplete-item').forEach(el => {
        el.addEventListener('click', () => {
            const index = parseInt(el.dataset.index);
            selectAutocompleteItem(topMatches[index]);
        });
        el.addEventListener('mouseenter', () => {
            autocompleteIndex = parseInt(el.dataset.index);
            updateAutocompleteSelection();
        });
    });
 
    dropdown.classList.add('show');
    autocompleteVisible = true;
    autocompleteItems = topMatches;
    autocompleteIndex = -1;
}
 
function highlightMatch(name, query) {
    if (name.startsWith(query)) {
        return `<strong>${query}</strong>${name.slice(query.length)}`;
    }
    if (name.includes(query)) {
        return name.replace(query, `<strong>${query}</strong>`);
    }
    if (name[0] === query[0]) {
        return `<strong>${name[0]}</strong>${name.slice(1)}`;
    }
    return name;
}
 
function updateAutocompleteSelection() {
    const dropdown = document.getElementById('autocompleteDropdown');
    const items = dropdown.querySelectorAll('.autocomplete-item');
    items.forEach((el, index) => {
        if (index === autocompleteIndex) {
            el.classList.add('selected');
            el.scrollIntoView({ block: 'nearest' });
        } else {
            el.classList.remove('selected');
        }
    });
}
 
function selectAutocompleteItem(item) {
    const textarea = document.getElementById('input');
    const value = textarea.value;
    const cursorPos = textarea.selectionStart;
 
    const lines = value.replace(/\r\n/g, '\n').split('\n');
    let lineStart = 0;
    let lineIndex = 0;
 
    for (let i = 0; i < lines.length; i++) {
        if (lineStart + lines[i].length >= cursorPos) {
            lineIndex = i;
            break;
        }
        lineStart += lines[i].length + 1;
    }
 
    const currentLine = lines[lineIndex];
    const numMatch = currentLine.match(/(\d+)$/);
    const quantity = numMatch ? numMatch[1] : '';
 
    lines[lineIndex] = item.name + quantity;
 
    textarea.value = lines.join('\n');
 
    const newPos = lineStart + item.name.length;
    textarea.setSelectionRange(newPos, newPos);
    textarea.focus();
 
    hideAutocomplete();
}
 
function hideAutocomplete() {
    const dropdown = document.getElementById('autocompleteDropdown');
    dropdown.classList.remove('show');
    autocompleteVisible = false;
    autocompleteIndex = -1;
    autocompleteItems = [];
}

    btn.textContent = '載入中...';

    try {
        const [res1, res2] = await Promise.all([
            fetch(SHEET_URL_KEZHONG),
            fetch(SHEET_URL_TABLET)
        ]);
 
        if (!res1.ok) throw new Error(`科中Sheet讀取失敗 (${res1.status})`);
        if (!res2.ok) throw new Error(`錠劑Sheet讀取失敗 (${res2.status})`);
 
        const tempKZ = parseCSV(await res1.text(), 'kezhong');
        const tempTablet = parseCSV(await res2.text(), 'tablet');
 
        const tabletSuffixChars = TABLET_SUFFIX.join('');
        for (const [name, data] of Object.entries(tempTablet)) {

                const alias = name + TABLET_SUFFIX[0];
                if (!tempTablet[alias]) tempTablet[alias] = data;
            }
        }
 
        DB_KZ = tempKZ;
        DB_TABLET = tempTablet;
 
        const kzCount = Object.keys(DB_KZ).length;
        const tabletCount = Object.keys(DB_TABLET).length;

            for (const v of Object.values(db)) c[v[0]] = (c[v[0]] || 0) + 1;
            return c;
        };
        const kzStat = countStatus(DB_KZ);

        statLine.innerHTML =

            + pill('缺貨', kzStat['缺货'], '#ff5252', '#4a0000')
            + pill('合約', kzStat['合约'], '#ffc400', '#4a3700')
            + pill('預訂', kzStat['預訂'], '#7c4dff', '#1a0057')
            + `<br><span style="color:#555;margin-right:4px;">錠劑：</span>`
            + pill('有貨', tbStat['有货'], '#00e676', '#00390f')
            + pill('缺貨', tbStat['缺货'], '#ff5252', '#4a0000')
            + pill('合約', tbStat['合约'], '#ffc400', '#4a3700')
            + pill('預訂', tbStat['預訂'], '#7c4dff', '#1a0057');
 
    } catch (e) {

        status.textContent = '❌ 載入失敗：' + errMsg;

        if (!Object.keys(DB_KZ).length) {
            document.getElementById('result').innerHTML = `<div class="error">❌ 載入失敗：${errMsg}<br>請確認 Google Sheet 仍是「任何人可檢視」<br><small>${SHEET_URL_KEZHONG.match(/\/d\/[\w-]+/)?.[0]}</small></div>`;
        }

    btn.disabled = false;
    searchBtn.disabled = false;
}

const CHANGE_GAS_URL = 'https://script.google.com/macros/s/AKfycbzF7UJKkAotK9CRZEctUSUqd5FB4Fmy4KipujO-A5wzXPEnGxenCZphAloAqJKKZJds/exec';
 
function postToGAS(payload) {
    let iframe = document.getElementById('gas-iframe');
    if (!iframe) {
        iframe = document.createElement('iframe');
        iframe.id = 'gas-iframe';
        iframe.name = 'gas-iframe';
        iframe.style.display = 'none';
        document.body.appendChild(iframe);
    }
    let form = document.getElementById('gas-form');
    if (form) form.remove();
    form = document.createElement('form');
    form.id = 'gas-form';
    form.method = 'POST';
    form.action = CHANGE_GAS_URL;
    form.target = 'gas-iframe';
    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = 'payload';
    input.value = JSON.stringify(payload);
    form.appendChild(input);
    document.body.appendChild(form);
    form.submit();
    form.remove();
}
 
async function checkChanges() {
    const btn = document.getElementById('changeBtn');
    btn.disabled = true;
    btn.textContent = '比對中...';
 
    if (!Object.keys(DB_KZ).length && !Object.keys(DB_TABLET).length) {
        await loadData();
    }
 
    try {
        if (!CHANGE_GAS_URL) {
            showChangeModal(await computeLocalChanges());
        } else {
            const res = await fetch(CHANGE_GAS_URL + '?action=getsnapshot');
            if (!res.ok) throw new Error('快照讀取失敗 (' + res.status + ')');
            const data = await res.json();
            const snapshot = data.snapshot || {};
            const snapshotDate = data.date || '';
            const today = new Date().toISOString().slice(0, 10);
            const isFirstRun = !snapshotDate;
 
            if (isFirstRun) {
                postToGAS({
                    action: 'record',
                    date: today,
                    changes: { added: [], removed: [], statusChanged: [] },
                    snapshot: buildCurrentSnapshot()
                });
                showChangeModal({ added: [], removed: [], statusChanged: [], firstRun: true });
            } else {
                const changes = computeChanges(DB_KZ, DB_TABLET, snapshot);
                if (snapshotDate !== today && (changes.added.length || changes.removed.length || changes.statusChanged.length)) {
                    postToGAS({
                        action: 'record',
                        date: today,
                        changes: changes,
                        snapshot: buildCurrentSnapshot()
                    });
                }
                showChangeModal(changes, snapshotDate);
            }
        }
    } catch (e) {
        console.error('異動偵測失敗:', e);
        showChangeModal({ added: [], removed: [], statusChanged: [], error: e.message });
    }
 
    btn.disabled = false;
    btn.textContent = '📋 異動';
}
 
function buildCurrentSnapshot() {
    const snap = {};
    for (const [name, data] of Object.entries(DB_KZ)) snap['KZ:' + name] = data[0];
    for (const [name, data] of Object.entries(DB_TABLET)) snap['TB:' + name] = data[0];
    return snap;
}
 
function computeChanges(currentKZ, currentTB, snapshot) {
    const current = {};
    for (const [name, data] of Object.entries(currentKZ)) current['KZ:' + name] = data[0];
    for (const [name, data] of Object.entries(currentTB)) current['TB:' + name] = data[0];
 
    const added = [];
    const removed = [];
    const statusChanged = [];
 
    for (const [key, status] of Object.entries(current)) {
        if (!(key in snapshot)) {
            added.push({ name: key.replace(/^(KZ:|TB:)/, ''), status, db: key.startsWith('TB:') ? '錠劑' : '科中' });
        } else if (snapshot[key] !== status) {
            statusChanged.push({ name: key.replace(/^(KZ:|TB:)/, ''), oldStatus: snapshot[key], newStatus: status, db: key.startsWith('TB:') ? '錠劑' : '科中' });
        }
    }
 
    for (const [key, status] of Object.entries(snapshot)) {
        if (!(key in current)) {
            removed.push({ name: key.replace(/^(KZ:|TB:)/, ''), status, db: key.startsWith('TB:') ? '錠劑' : '科中' });
        }
    }
 
    return { added, removed, statusChanged };
}
 
async function computeLocalChanges() {
    const STORAGE_KEY = 'tcm_snapshot';
    const DATE_KEY = 'tcm_snapshot_date';
    const today = new Date().toISOString().slice(0, 10);
    const current = buildCurrentSnapshot();
 
    const savedRaw = localStorage.getItem(STORAGE_KEY);
    const savedDate = localStorage.getItem(DATE_KEY) || '';
 
    if (!savedRaw) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(current));
        localStorage.setItem(DATE_KEY, today);
        return { added: [], removed: [], statusChanged: [], firstRun: true };
    }
 
    const snapshot = JSON.parse(savedRaw);
    const changes = computeChanges(DB_KZ, DB_TABLET, snapshot);
 
    localStorage.setItem(STORAGE_KEY, JSON.stringify(current));
    localStorage.setItem(DATE_KEY, today);
 
    return { ...changes, snapshotDate: savedDate };
}
 
function showChangeModal(changes, snapshotDate) {
    const old = document.querySelector('.change-overlay');
    if (old) old.remove();
 
    const overlay = document.createElement('div');
    overlay.className = 'change-overlay';
    overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
 
    let html = '<div class="change-modal">';
    html += '<button class="close-btn" onclick="this.closest(\'.change-overlay\').remove()">&times;</button>';
 
    if (changes.error) {
        html += '<h3>❌ 異動偵測失敗</h3>';
        html += '<div class="change-empty">' + changes.error + '</div>';
    } else if (changes.firstRun) {
        html += '<h3>📋 庫存異動</h3>';
        html += '<div class="change-empty">首次使用，已儲存快照基準。<br>下次比對即可看到異動。</div>';
    } else {
        const total = changes.added.length + changes.removed.length + changes.statusChanged.length;
        html += '<h3>📋 庫存異動</h3>';
        if (snapshotDate) html += '<div class="change-date">基準日：' + snapshotDate + ' → 今天</div>';
        if (total === 0) {
            html += '<div class="change-empty">✅ 無異動</div>';
        } else {
            html += '<div class="change-list">';
            if (changes.added.length) {
                html += '<div style="font-size:13px;color:#155724;font-weight:bold;margin:8px 0 4px">🆕 新增品項</div>';
                for (const item of changes.added) {
                    html += '<div class="change-item added"><span class="change-name">' + item.name + '</span><span class="change-detail">' + item.db + ' · ' + statusLabel(item.status) + '</span></div>';
                }
            }
            if (changes.removed.length) {
                html += '<div style="font-size:13px;color:#721c24;font-weight:bold;margin:8px 0 4px">🗑️ 消失品項</div>';
                for (const item of changes.removed) {
                    html += '<div class="change-item removed"><span class="change-name">' + item.name + '</span><span class="change-detail">' + item.db + ' · ' + statusLabel(item.status) + '</span></div>';
                }
            }
            if (changes.statusChanged.length) {
                html += '<div style="font-size:13px;color:#856404;font-weight:bold;margin:8px 0 4px">🔄 狀態變化</div>';
                for (const item of changes.statusChanged) {
                    html += '<div class="change-item status-change"><span class="change-name">' + item.name + '</span><span class="change-detail">' + statusLabel(item.oldStatus) + ' → ' + statusLabel(item.newStatus) + '</span></div>';
                }
            }
            html += '</div>';
            html += '<div style="text-align:center;margin-top:10px;font-size:13px;color:#888">共 ' + total + ' 項異動</div>';
        }
    }
 
    html += '</div>';
    overlay.innerHTML = html;
    document.body.appendChild(overlay);
}
 
function statusLabel(status) {
    if (status === '有货') return '有貨';
    if (status === '合约') return '合約';
    if (status === '缺货' || status === '无') return '缺貨';
    if (/預|订|定/.test(status)) return '預訂';
    if (status === '?') return '未知';
    return status;
}

function autoResize(textarea) {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(Math.max(textarea.scrollHeight, 120), 400) + 'px';
}

function scrollToCursor(textarea) {
    const cursorPos = textarea.selectionStart;
    const textBeforeCursor = textarea.value.substring(0, cursorPos);
    const lineCount = textBeforeCursor.split('\n').length;
    const lineHeight = 20; // 估算每列高度
    textarea.scrollTop = (lineCount - 3) * lineHeight;
}

function clearInput() {
    const input = document.getElementById('input');
    input.value = '';
    autoResize(input);
    document.getElementById('result').innerHTML = '';
    hideAutocomplete();
}

function togglePrice() {
    showPrice = !showPrice;
    const btn = document.getElementById('priceBtn');
    if (showPrice) {
        btn.textContent = '🙈 隱藏價格';
        btn.classList.add('price-active');
    } else {
        btn.textContent = '👁️ 顯示價格';
        btn.classList.remove('price-active');
    }
    const resultDiv = document.getElementById('result');
    if (resultDiv.innerHTML !== '') {
        search();
    }
}

// ===== 頁面載入自動處理 =====
window.addEventListener('load', function() {
    loadData();
    initAutocomplete();
    const ta = document.getElementById('input');
    if (ta) autoResize(ta);
});
 
window.addEventListener('beforeunload', function() {
    if (typeof isListening !== 'undefined' && isListening && typeof recognition !== 'undefined' && recognition) {
        recognition.stop();
        recognition = null;
        isListening = false;
    }
});
 
document.addEventListener('visibilitychange', function() {
    if (document.hidden && typeof isListening !== 'undefined' && isListening && typeof recognition !== 'undefined' && recognition) {
        recognition.stop();
        recognition = null;
        isListening = false;
        const voiceBtn = document.getElementById('voiceBtn');
        if (voiceBtn) {
            voiceBtn.textContent = '🎤 語音輸入';
            voiceBtn.style.background = '#667eea';
        }
    }
});

function search() {
    if (typeof isListening !== 'undefined' && isListening && typeof recognition !== 'undefined' && recognition) {
        recognition.stop();
        recognition = null;
        isListening = false;
        const voiceBtn = document.getElementById('voiceBtn');
        if (voiceBtn) {
            voiceBtn.textContent = '🎤 語音輸入';
            voiceBtn.style.background = '#667eea';
        }
    }
 
    const isStale = !lastLoadTime || (Date.now() - lastLoadTime > STALE_MS);
    const needsLoad = !Object.keys(DB_KZ).length || !Object.keys(DB_TABLET).length;
 
    if (needsLoad) {
        document.getElementById('result').innerHTML = '<div class="error">請先點「🔄 更新資料」載入庫存資料</div>';
        return;
    }
    if (isStale) {
        loadData(true);
    }
 
    const inputEl = document.getElementById('input');
    const lines = inputEl.value.replace(/\r\n/g, '\n').trim().split('\n').map(l => toHalfWidthDigits(l.trim())).filter(Boolean);
 
    if (!lines.length) {
        inputEl.focus();
        return;
    }
 
    const GE_REG = /^各(\d{1,3})$/;
    const SPEC_KW_PRE = /^(100G|200G|單方|複方|錠劑|科中)/i;

    const isLikelyCustomerOrRemark = (s) => {
        const t = s.trim();
        if (t.startsWith('@') || GE_REG.test(t) || SPEC_KW_PRE.test(t)) return false;
        if (/[\d瓶罐包盒顆粒]/.test(t)) return false;
        const trad = toTraditional(t);
        if (DB_KZ[trad] || DB_TABLET[trad]) return false;
        for (const [correct, typos] of Object.entries(TYPO_MAP)) {
            if (trad === correct || (Array.isArray(typos) && typos.includes(trad))) return false;
        }
        const formulaSuffixes = ['湯','散','丸','飲','膏','丹','煎','劑','露','片'];
        for (const suffix of formulaSuffixes) {
            if (DB_KZ[trad + suffix] || DB_TABLET[trad + suffix]) return false;
        }
        return true;
    };

    const gePositions = [];
    for (let i = 0; i < lines.length; i++) {
        const geMatch = lines[i].match(GE_REG);
        if (geMatch) gePositions.push({ index: i, qty: geMatch[1] });
    }

    for (let g = gePositions.length - 1; g >= 0; g--) {
        const { index: geIdx, qty: geQty } = gePositions[g];
        const prevGeIdx = g > 0 ? gePositions[g - 1].index : -1;
        let j = geIdx - 1;
        while (j > prevGeIdx) {
            const lj = lines[j].trim();
            if (lj.startsWith('@')) break;
            if (SPEC_KW_PRE.test(lj)) break;
            if (isLikelyCustomerOrRemark(lj)) break;
            if (!/\d{1,3}(?:[瓶罐包盒顆粒]?)$/.test(lj)) {
                lines[j] = lj + geQty;
            }
            j--;
        }
    }

    const processedLines = lines.filter(l => !GE_REG.test(l.trim()));

    let html = '';
    let totalPrice = 0;
    let totalCount = 0;
    let copyText = '';
    let currentCustomer = '';

    processedLines.forEach(line => {
        const rawLine = line.trim();
        if (!rawLine) return;

        if (rawLine.startsWith('@') || isLikelyCustomerOrRemark(rawLine)) {
            currentCustomer = rawLine.replace(/^@/, '');
            html += `<div class="result-item customer-name">👤 客戶/備註：${currentCustomer}</div>`;
            copyText += `【${currentCustomer}】\n`;
            return;
        }

        const numMatch = rawLine.match(/(\d+)\s*([瓶罐包盒顆粒]?)$/);
        let qty = 1;
        let nameQuery = rawLine;

        if (numMatch) {
            qty = parseInt(numMatch[1], 10);
            nameQuery = rawLine.slice(0, rawLine.lastIndexOf(numMatch[0])).trim();
        }

        const tradQuery = toTraditional(nameQuery);
        const isTablet = TABLET_SUFFIX.some(s => tradQuery.includes(s));
        
        let match = isTablet ? findBestMatchInTablet(tradQuery) : findBestMatchInKZ(tradQuery);

        if (!match && !isTablet) {
            match = findBestMatchInTablet(tradQuery);
        }

        if (match) {
            if (match.multiCandidate) {
                html += `
                    <div class="result-item">
                        <div class="name">❓ ${rawLine} (多項匹配)</div>
                        <div class="original">請確認要查詢的品項：${match.candidates.join(' / ')}</div>
                    </div>`;
            } else {
                const itemPrice = match.price !== '時價' ? parseFloat(match.price) : 0;
                const linePrice = itemPrice * qty;
                totalPrice += linePrice;
                totalCount += qty;

                const stockBadge = match.status === '有货' 
                    ? '<span class="badge in-stock">✅ 有貨</span>' 
                    : match.status === '合约' 
                    ? '<span class="badge contract">📋 合約</span>' 
                    : match.status === '預訂' 
                    ? '<span class="badge booking">⏳ 預訂</span>' 
                    : '<span class="badge out-stock">⚠️ 缺貨</span>';

                const specBadge = match.spec ? `<span class="badge spec">${match.spec}</span>` : '';
                const displayPrice = showPrice ? (match.price !== '時價' ? `$${match.price} x ${qty} = $${linePrice}` : '時價') : '';
                const correctedBadge = match.corrected ? '<span class="badge corrected">❓ 有疑問</span>' : '';

                html += `
                    <div class="result-item">
                        <div class="name">${match.name} ${match.spec ? `(${match.spec})` : ''} x${qty}</div>
                        <div>
                            ${specBadge}
                            ${stockBadge}
                            ${correctedBadge}
                        </div>
                        ${showPrice ? `<div class="price">${displayPrice}</div>` : ''}
                    </div>`;

                copyText += `${match.name} ${match.spec ? `(${match.spec})` : ''} x${qty} - ${statusLabel(match.status)}\n`;
            }
        } else {
            html += `
                <div class="result-item">
                    <div class="name">${rawLine}</div>
                    <div><span class="badge not-found">❌ 無生產</span></div>
                </div>`;
            copyText += `${rawLine} - 無生產\n`;
        }
    });

    if (totalCount > 0 && showPrice) {
        html += `
            <div class="summary">
                <div class="total">總計：$${totalPrice}</div>
                <div class="count">共 ${totalCount} 件商品</div>
            </div>`;
    }

    if (copyText) {
        html += `
            <div class="copy-box">
                <h4>📋 查詢結果複製</h4>
                <div class="copy-content" id="copyContent">${copyText}</div>
                <button class="copy-btn" onclick="copyResult()">複製結果</button>
            </div>`;
    }

    document.getElementById('result').innerHTML = html;
}

function copyResult() {
    const text = document.getElementById('copyContent').innerText;
    navigator.clipboard.writeText(text).then(() => {
        const btn = document.querySelector('.copy-btn');
        btn.textContent = '✅ 已複製！';
        btn.classList.add('copied');
        setTimeout(() => {
            btn.textContent = '複製結果';
            btn.classList.remove('copied');
        }, 2000);
    });
}
</script>
