function search() {
    // 关闭麦克风（如果在录音中）
    if (isListening && recognition) {
        recognition.stop();
        recognition = null;
        isListening = false;
        const voiceBtn = document.getElementById('voiceBtn');
        voiceBtn.textContent = '🎤 語音輸入';
        voiceBtn.style.background = '#667eea';
    }
 
    // 检查数据——首次查询或超过5分钟未刷新时自动更新
    const isStale = !lastLoadTime || (Date.now() - lastLoadTime > STALE_MS);
    const needsLoad = !Object.keys(DB_KZ).length || !Object.keys(DB_TABLET).length;
 
    if (needsLoad) {
        // 没有资料：显示提示，让用户点更新按钮
        document.getElementById('result').innerHTML = '<div class="error">請先點「🔄 更新資料」載入庫存資料</div>';
        return;
    }
    if (isStale) {
        // 数据过期：后台静默刷新
        loadData(true);  // 异步后台刷新，不阻塞查询
    }
 
    const inputEl = document.getElementById('input');
    // 處理貼上時可能攜帶的 \r\n 換行符
    // 先保留所有行，用於偵測「其它」分隔關鍵字：「其它」行以後的品項不做庫存比對，直接輸出
    const rawLines = inputEl.value.replace(/\r\n/g, '\n').trim().split('\n').map(l => toHalfWidthDigits(l.trim()));
    let passthroughLines = [];
    // 偵測「其它」（也兼容「其他」）作為分隔標記
    const separatorIdx = rawLines.findIndex(l => /^(其它|其他)\s*$/i.test(l));
    let lines;
    if (separatorIdx !== -1) {
        lines = rawLines.slice(0, separatorIdx).filter(Boolean);
        passthroughLines = rawLines.slice(separatorIdx + 1).filter(Boolean);
    } else {
        lines = rawLines.filter(Boolean);
    }
 
    if (!lines.length) {
        inputEl.focus();
        return;
    }
 
    // 📦 「各N」預處理：遇到「各6」「各12」「各10瓶」「各10罐」等，往前回溯分配數量到未帶數量的品項行
    // 允許數字後面接常見單位字（瓶罐包盒顆粒錠），單位不影響實際分配的數量
    const GE_REG = /^各(\d{1,3})\s*(?:[瓶罐包盒顆粒錠])?$/;
    const SPEC_KW_PRE = /^(100G|200G|單方|複方|錠劑|科中)/i;
        // 偵測客戶名行：不含數量、不在庫存中、不以@開頭、不是規格、不是各N → 視為客戶名/備註
    const isLikelyCustomerOrRemark = (s) => {
        const t = s.trim();
        if (t.startsWith('@') || GE_REG.test(t) || SPEC_KW_PRE.test(t)) return false;
        if (/[\d瓶罐包盒顆粒]/.test(t)) return false; // 含數量或單位 → 不是客戶名
        const trad = toTraditional(stripQueryNoise(t)); // 先清括號與多餘符號再查庫存（例：「防風通聖散（錠）」）
        if (DB_KZ[trad] || DB_TABLET[trad]) return false; // 庫存有此品項 → 不是客戶名
        // TYPO_MAP 也查：只要在 TYPO_MAP 中找到（不管 DB 有無），就不是客戶名
        for (const [correct, typos] of Object.entries(TYPO_MAP)) {
            if (trad === correct || (Array.isArray(typos) && typos.includes(trad))) return false;
        }
        // 後綴匹配也查：加上方劑後綴能在 DB 中找到 → 不是客戶名
        const formulaSuffixes = ['湯','散','丸','飲','膏','丹','煎','劑','露','片'];
        for (const suffix of formulaSuffixes) {
            if (DB_KZ[trad + suffix] || DB_TABLET[trad + suffix]) return false;
        }
        // 前綴匹配也查：品名以它開頭就算品項（如「川七錠」→ 實際品名「川七錠1000T」）
        const prefixed = Object.keys(DB_KZ).some(n => n.startsWith(trad))
            || Object.keys(DB_TABLET).some(n => n.startsWith(trad));
        if (prefixed) return false;
        return true; // 不含數量、不在庫存 → 視為客戶名/備註
    };
    // 先找出所有「各N」行的索引和數量
    const gePositions = [];
    for (let i = 0; i < lines.length; i++) {
        const geMatch = lines[i].match(GE_REG);
        if (geMatch) gePositions.push({ index: i, qty: geMatch[1] });
    }
    // 從後往前處理（避免 splice 造成索引偏移）
    for (let g = gePositions.length - 1; g >= 0; g--) {
        const { index: geIdx, qty: geQty } = gePositions[g];
        const prevGeIdx = g > 0 ? gePositions[g - 1].index : -1;
        let j = geIdx - 1;
        while (j > prevGeIdx) {
            const lj = lines[j].trim();
            if (lj.startsWith('@')) break;      // 碰到 @客戶名，停止
            if (SPEC_KW_PRE.test(lj)) break;    // 碰到規格行，停止
            if (isLikelyCustomerOrRemark(lj)) break;  // 碰到非@客戶名/備註，停止
            if (!parseNameQty(lj).hasQty) {
                lines[j] = lj + ' ' + geQty;    // 追加數量（空格分隔）
            }
            j--;
        }
        lines.splice(geIdx, 1);  // 刪除「各N」行本身
    }
 
    const skipKeywords = ['100g', '200g', '單方', '複方', '科中', '錠劑'];
    let results = [];  // 保存结果，保持顺序
    let copyText = '';
    let stats = { inStock: 0, contract: 0, outStock: 0, booking: 0, unknown: 0, total: 0, kzTotal: 0, tabletTotal: 0, inStockItems: 0, contractItems: 0, outStockItems: 0, bookingItems: 0, unknownItems: 0 };
    let lineIndex = 0;
    for (const line of lines) {
        lineIndex++;
        // 跳过规格行（仍保留到 results，排序後再輸出）
        if (skipKeywords.includes(line.toLowerCase())) {
            results.push({ displayName: line.trim(), outputName: line.trim(), qty: 1, status: 'specification', source: 'spec' });
            continue;
        }
 
        // 客戶名稱偵測（兩種入口）
        // 入口1：以 @ 開頭標示，例如 @王中醫 → 輸出 [王中醫]
        // 入口2：第一行不含數量、不在庫存中 → 視為客戶名
        if (line.trim().startsWith('@')) {
            const customerName = line.trim().substring(1).trim();
            if (customerName) {
                // copyText 改由排序後統一組裝
                results.push({ displayName: customerName, outputName: customerName, qty: 1, status: 'customer-name', source: 'note' });
                continue;
            }
        }
        // 入口2：第一行無@前缀，但看起來是客戶名
        if (lineIndex === 1 && isLikelyCustomerOrRemark(line.trim())) {
            // copyText 改由排序後統一組裝
            results.push({ displayName: line.trim(), outputName: line.trim(), qty: 1, status: 'customer-name', source: 'note' });
            continue;
        }
 
        // 检查是否为规格关键词（100G, 200G, 單方, 複方, 錠劑）
 
        // 白名单：包含这些关键词的行不当作规格关键词，直接匹配库存
 
        const SPEC_KW_REG = /^(100G|200G|單方|複方|錠劑|科中)\s*(?:\+?\d+)?\s*$/i;
        const isSpecification = SPEC_KW_REG.test(line.trim());
        
        if (isSpecification) {
            // 规格关键词直接输出，不进行产品匹配
            // copyText 改由排序後統一組裝
            const specQtyMatch = line.match(/\+?(\d+)$/);
            const specQty = specQtyMatch ? parseInt(specQtyMatch[1]) : 1;
            results.push({ displayName: line.trim(), outputName: line.trim(), qty: specQty, status: 'specification', source: 'spec' });
            continue;
        }
 
        // 用戶主動點選候選 = 確認，不標記有疑問
 
        // 解析產品名和數量（未寫數量則預設 1；問號、括號、符號由 parseNameQty／stripQueryNoise 處理）
        // 實際使用習慣：品名3、品名3瓶、品名3罐
        const hasQuestionMark = /[?？]/.test(line);
        const parsed = parseNameQty(line);
        const qty = parsed.qty;
        const hasUserQty = parsed.hasQty;
        const originalProductName = parsed.name;
 
        // 正式解析產品名和數量；200g/100g 是包裝規格，不等於購買數量
        // 比對前先清掉括號與多餘符號（例：「防風通聖散（錠）」→「防風通聖散錠」）
        const query = normalizeSearchText(stripQueryNoise(originalProductName));  // 正規化（簡繁／全半形／空白）再匹配
 
        if (!query) continue;
 
        // 检查是否有「?」，有則標記為有疑問
 
        // V2 統一搜尋（科中 + 錠劑同一引擎）
        let result = null;
        let ambiguousAlt = null;  // 歧義時的備選結果
 
        const match = findBestMatchV2(query);
        if (match && match.multiCandidate) {
            const outputNameMC = originalProductName + ' ' + qty;
            results.push({ displayName: originalProductName, outputName: outputNameMC, qty, status: 'multi_candidate', source: 'none', fuzzy: true, candidates: match.candidates });
            continue;
        }
        if (match) {
            const src = match.source === 'tablet' ? 'tablet' : 'kz';
            const spec = match.source === 'tablet' ? '錠劑' : (match.spec || '200g');
            // 輸入是品名開頭（例：「川七錠」→「川七錠1000T」）屬於縮寫，不是打錯字，不標「有疑問」
            const isPrefixAbbrev = query.length >= 2 && normalizeSearchText(match.name).startsWith(query);
            result = {
                displayName: match.name,
                status: match.status,
                price: match.price,
                spec,
                source: src,
                corrected: match.corrected,
                fuzzy: hasQuestionMark || (!isPrefixAbbrev && (match.fuzzy || (match.corrected && normalizeSearchText(query).length >= 3)))
            };
            if (match.ambiguous) {
                result.ambiguous = true;
                ambiguousAlt = { displayName: query, outputName: query + ' ' + qty, qty, status: '單方', source: 'kz', isBooking: false, isContract: false, isInStock: false, isUnknown: false, unitPrice: 0, totalPrice: 0, fuzzy: false, hasUserQty };
            }
        }
 
        if (result) {
            const { displayName, status, price, source, fuzzy, spec } = result;
            const unitPrice = price === '時價' ? 0 : parseInt(price) || 0;
            const totalPrice = unitPrice * qty;
            const isInStock = status === '有货';
            const isContract = status === '合约';
            const isBooking = status === '預訂';
            const isUnknown = status === '?';
 
            // 更新统计
            if (isBooking) {
                stats.booking += qty;
                stats.bookingItems++;
            } else if (isContract) {
                stats.contract += qty;
                stats.contractItems++;
                stats.total += totalPrice;
                if (source === 'tablet') stats.tabletTotal += totalPrice; else stats.kzTotal += totalPrice;
            } else if (isInStock) {
                stats.inStock += qty;
                stats.inStockItems++;
                stats.total += totalPrice;
                if (source === 'tablet') stats.tabletTotal += totalPrice; else stats.kzTotal += totalPrice;
            } else if (isUnknown) {
                stats.unknown = (stats.unknown || 0) + qty;
                stats.unknownItems++;
            } else {
                stats.outStock += qty;
                stats.outStockItems++;
            }
 
            // 输出时组合：产品名 + 空格 + 数量 + 規格標註
            // 規則：未輸入數量時預設為 1，適用所有規格（科中／錠劑皆同），一律顯示數量
            const specSuffix = spec ? `（${spec}）` : '';
            const qtyPart = ' ' + qty;  // 無論是否有輸入、無論規格，皆顯示數量（預設 1）
            const outputName = displayName + qtyPart + specSuffix;
 
            // 注意：copyText 改由排序後統一組裝，此處不再寫入，避免順序錯亂
 
            // 保存结果（含 spec 供後續排序使用）
            results.push({ displayName, outputName, qty, status, price, isBooking, isContract, isInStock, isUnknown, unitPrice, totalPrice, source, fuzzy, hasUserQty, ambiguous: result.ambiguous, ambiguousAlt, spec });
        } else {
            const outputNameForNotFound = originalProductName + ' ' + qty;
            // copyText 改由排序後統一組裝
            results.push({ displayName: originalProductName, outputName: outputNameForNotFound, qty: qty, status: 'not_found', source: 'none', fuzzy: hasQuestionMark });
        }
    }
 
    // ===== 依包裝規格排序：客戶名 → 200g → 100g → 錠劑 → 其他（同類內保持原輸入順序） =====
    results.forEach((item, i) => { item._ord = i; });
    const specRank = (item) => {
        if (item.status === 'customer-name') return -2;
        if (item.spec === '200g') return 0;
        if (item.spec === '100g') return 1;
        if (item.spec === '錠劑' || item.source === 'tablet') return 2;
        if (item.status === 'specification') {
            const n = String(item.outputName || '').toLowerCase();
            if (/200/.test(n)) return 0;
            if (/100/.test(n)) return 1;
            if (/錠/.test(n)) return 2;
        }
        return 3;
    };
    results.sort((a, b) => specRank(a) - specRank(b) || a._ord - b._ord);
 
    // 依排序結果重新組裝 copyText（一行一項，無多餘前導空白）
    // 規則：客戶名 → 200g → 100g → 錠劑 → 其他；只輸出有貨／合約／預訂（缺貨、無生產另處理）
    // 規格改為「群組標題」統一顯示一次（例如「（200g）」），同群組內的品項不再逐行重複規格
    copyText = '';
    let currentSpecGroup = null; // 追蹤目前輸出到哪個規格群組，換組時才印一次規格標題
    for (const item of results) {
        if (item.status === 'customer-name') {
            copyText += `[${item.displayName}]\n`;
            currentSpecGroup = null; // 換客戶重新開始，遇到規格會再印一次標題
            continue;
        }
        if (item.status === 'specification') {
            copyText += item.outputName + '\n';
            continue;
        }
        if (item.status === 'multi_candidate') {
            copyText += item.outputName + '\t請確認：' + (item.candidates || []).join('／') + '\n';
            continue;
        }
        if (item.status === 'not_found') {
            copyText += item.outputName + '\t無生產\n';
            continue;
        }
        // 一般品項：規格改用群組標題呈現。只有「真的會印出這一行」時才印規格標題，
        // 避免整個規格群組都缺貨（沒有任何一行被印出）時，留下孤立的空白規格標題
        const lineName = item.displayName + ' ' + item.qty; // 品名+數量，不含規格後綴（規格已移到群組標題）
        const emitSpecHeader = () => {
            if (item.spec && item.spec !== currentSpecGroup) {
                copyText += `（${item.spec}）\n`;
                currentSpecGroup = item.spec;
            }
        };
        if (item.ambiguous && item.ambiguousAlt) {
            emitSpecHeader();
            const mainStatusHint = item.isBooking ? '預訂' : item.isContract ? '合約' : item.isInStock ? '有貨' : '缺貨';
            copyText += lineName + '（' + mainStatusHint + '）';
            const alt = item.ambiguousAlt;
            const altStatusHint = alt.status === '單方' ? '單方' : (alt.isInStock ? '有貨' : alt.isBooking ? '預訂' : alt.isContract ? '合約' : '缺貨');
            const altOutputName = alt.displayName + ' ' + item.qty;
            copyText += ' 或 ' + altOutputName + '（' + altStatusHint + '）\n';
        } else if (item.isInStock) {
            emitSpecHeader();
            copyText += lineName + '\n';
        } else if (item.isContract) {
            emitSpecHeader();
            copyText += lineName + '（合約）\n';
        } else if (item.isBooking) {
            emitSpecHeader();
            copyText += lineName + '（預）\n';
        }
        // 缺貨：不放入可複製文字，也不觸發規格標題（與原邏輯一致）
    }

    // ===== 直通品項：「其它」分隔後的品項，不做庫存比對，直接追加到複製文字末尾 =====
    if (passthroughLines.length > 0) {
        copyText += '其它\n';  // 輸出「其它」標題行
        for (const ptLine of passthroughLines) {
            // 解析品名與數量（與主流程共用 parseNameQty），未寫數量預設 1
            const ptParsed = parseNameQty(ptLine);
            copyText += `${ptParsed.name} ${ptParsed.qty}\n`;
        }
    }

    // 构建HTML（已依規格排序）
    let html = '';
 
    for (const item of results) {
        // 过滤：有疑问+缺货不显示（歧義結果除外，歧義雙選需顯示）
        // 2026-06-27 fix: fuzzy+缺貨也顯示（帶❓有疑問標記），不再跳過
        // 用戶需要知道缺貨資訊，fuzzy 只是提醒用戶確認品名是否正確
 
        if (item.status === 'multi_candidate') {
            html += `<div class="result-item">
                <div class="name">${escapeHTML(item.outputName)}<span class="fuzzy-badge">❓ 有疑問</span></div>
                <div class="badge not-found">請確認：${escapeHTML(item.candidates.join('／'))}</div>
            </div>`;
        } else if (item.status === 'not_found') {
            const fuzzyBadge = item.fuzzy ? '<span class="fuzzy-badge">❓ 有疑問</span>' : '';
            html += `<div class="result-item">
                <div class="name">${escapeHTML(item.outputName)}${fuzzyBadge}</div>
                <div class="badge not-found">無生產</div>
            </div>`;
        } else if (item.status === 'specification') {
            // 规格关键词：直接显示，不加状态
            html += `<div class="result-item">
                <div class="name">${escapeHTML(item.outputName)}</div>
                <div class="badge spec">規格</div>
            </div>`;
        } else if (item.status === 'customer-name') {
            // 第一行客戶名稱：灰色斜體顯示，不影響統計
            html += `<div class="result-item">
                <div class="name" style="font-style:italic;color:#888;">👤 ${escapeHTML(item.outputName)}</div>
                <div class="badge customer-name">客戶名稱</div>
            </div>`;
        } else if (item.ambiguous && item.ambiguousAlt) {
            // 歧義雙選：同時顯示方劑和單方藥，讓用戶自行選擇
            const alt = item.ambiguousAlt;
            const altStatusClass = alt.isBooking ? 'booking' : alt.isContract ? 'contract' : alt.isInStock ? 'in-stock' : alt.status === '單方' ? 'spec' : 'out-stock';
            const altBadgeContent = alt.status === '單方' ? '🌿 單方' : alt.isBooking ? '⏳ 預訂' : alt.isContract ? '📋 合約' : alt.isInStock ? '✅ 有貨' : '⚠️ 缺貨';
            const altPriceStr = showPrice && alt.unitPrice ? (alt.qty > 1 ? `${alt.unitPrice}x${alt.qty}=${alt.totalPrice}元` : `${alt.unitPrice}元`) : '';
            const priceStr = showPrice ? (item.price === '時價' ? '請電洽' : (item.qty > 1 ? `${item.unitPrice}x${item.qty}=${item.totalPrice}元` : `${item.price}元`)) : '';
            const statusClass = item.isBooking ? 'booking' : item.isContract ? 'contract' : item.isInStock ? 'in-stock' : 'out-stock';
            const badgeContent = item.isBooking ? '⏳ 預訂' : item.isContract ? '📋 合約' : item.isInStock ? '✅ 有貨' : '⚠️ 缺貨';
            const nameWithStatus = item.outputName + (item.isBooking ? '（預訂）' : item.isContract ? '（合約）' : item.isInStock ? '（有貨）' : '（缺貨）');
            const altLabel = alt.status === '單方' ? '（單方）' : (alt.isBooking ? '（預訂）' : alt.isContract ? '（合約）' : alt.isInStock ? '（有貨）' : '（缺貨）');
            html += `<div class="result-item" style="flex-wrap:wrap;gap:4px;">
                <div class="name">${escapeHTML(nameWithStatus)}<span style="color:#888;font-size:0.85em;"> 或 ${escapeHTML(alt.outputName)}${altLabel}</span></div>
                <div class="badge ${statusClass}">${badgeContent}</div>
                <div class="price">${priceStr}</div>
            </div>`;
        } else if (item.isUnknown) {
            const priceStr = showPrice ? (item.price === '時價' ? '請電洽' : `${item.price}元`) : '';
            html += `<div class="result-item">
                <div class="name">${escapeHTML(item.outputName)}</div>
                <div class="badge unknown">❓ 未知</div>
                <div class="price">${priceStr}</div>
            </div>`;
        } else {
            const priceStr = showPrice ? (item.price === '時價' ? '請電洽' : (item.qty > 1 ? `${item.unitPrice}x${item.qty}=${item.totalPrice}元` : `${item.price}元`)) : '';
            const statusClass = item.isBooking ? 'booking' : item.isContract ? 'contract' : item.isInStock ? 'in-stock' : 'out-stock';
            const badgeContent = item.isBooking ? '⏳ 預訂' : item.isContract ? '📋 合約' : item.isInStock ? '✅ 有貨' : '⚠️ 缺貨';
            const fuzzyBadge = (item.fuzzy && !item.hasUserQty && !item.ambiguous) ? '<span class="fuzzy-badge">❓ 有疑問</span>' : '';
            const nameWithStatus = item.outputName + (item.isBooking ? '（預）' : item.isContract ? '📋' : item.isInStock ? '✅' : '（缺）');
            html += `<div class="result-item">
                <div class="name">${escapeHTML(nameWithStatus)}${fuzzyBadge}</div>
                <div class="badge ${statusClass}">${badgeContent}</div>
                <div class="price">${priceStr}</div>
            </div>`;
        }
    }

    // ===== 直通品項：圖形化顯示（不做庫存比對，標示為「其它」） =====
    if (passthroughLines.length > 0) {
        html += `<div class="category"><h3>其它</h3></div>`;
        for (const ptLine of passthroughLines) {
            const ptParsed = parseNameQty(ptLine);
            html += `<div class="result-item">
                <div class="name">${escapeHTML(ptParsed.name)} ${ptParsed.qty}</div>
                <div class="badge spec">直通</div>
                <div class="price"></div>
            </div>`;
        }
    }

    // 折扣總額：0.58折／0.6折僅套用在科中（100g/200g）小計，錠劑不打折，折後金額需與錠劑小計相加
    const discount58Total = Math.round(stats.kzTotal * 0.58) + stats.tabletTotal;
    const discount60Total = Math.round(stats.kzTotal * 0.6) + stats.tabletTotal;

    // 汇总统计
    html += `<div class="summary">
        <div class="total">${showPrice && stats.total > 0 ? stats.total + ' 元' : '查詢完成'}</div>
        ${showPrice && stats.total > 0 ? `<div class="total-discount">58折：${discount58Total} 元　60折：${discount60Total} 元</div>` : ''}
        <div class="count">✅ 有貨 ${stats.inStockItems} 項（${stats.inStock} 瓶） | 📋 合約 ${stats.contractItems} 項（${stats.contract} 瓶） | ⚠️ 缺貨 ${stats.outStockItems} 項 | ⏳ 預訂 ${stats.bookingItems} 項${stats.unknownItems ? ` | ❓ 未知 ${stats.unknownItems} 項` : ''}</div>
    </div>`;
    
    // 复制框
    html += `<div class="copy-box">
        <h4>📋 查詢結果（可複製）</h4>
        <div class="copy-content" id="copyContent">${escapeHTML(copyText)}</div>
        <button class="copy-btn" id="copyBtn">複製結果</button>
    </div>`;
 
    // 更新DOM
    document.getElementById('result').innerHTML = html;
 
    // 绑定复制按钮
    document.getElementById('copyBtn').addEventListener('click', function() {
        navigator.clipboard.writeText(copyText).then(() => {
            this.textContent = '✅ 已複製！';
            this.classList.add('copied');
            setTimeout(() => {
                this.textContent = '複製結果';
                this.classList.remove('copied');
            }, 1500);
        }).catch(err => {
            console.error('複製失敗:', err);
            alert('複製失敗，請手動複製');
        });
    });
}
 
function clearInput() { const el = document.getElementById('input'); el.value = ''; document.getElementById('result').innerHTML = ''; el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
function togglePrice() { showPrice = !showPrice; const btn = document.getElementById('priceBtn'); btn.textContent = showPrice ? '🙈 隱藏價格' : '💰 顯示價格'; btn.classList.toggle('price-active', showPrice); if (document.getElementById('input').value) search(); }
 
// ===== 自動延長輸入框 =====
function autoResize(el) {
    el.style.height = 'auto';                    // 重置，讓它能縮小
    const newHeight = el.scrollHeight;
    el.style.height = newHeight + 'px';          // 撐開到實際高度
    // 超出上限時允許捲動，否則隱藏溢出
    el.style.overflowY = newHeight > 400 ? 'auto' : 'hidden';
    // 確保游標可見
    if (newHeight > 400) {
        el.scrollTop = el.scrollHeight;
    }
}
 
function scrollToCursor(el) {
    // 將 textarea 捲動到游標所在位置可見
    if (el.scrollHeight <= 400) return;  // 未超出上限不需要捲動
    const pos = el.selectionEnd;
    const textBefore = el.value.substring(0, pos);
    const linesBefore = textBefore.split('\n').length;
    const lineHeight = parseFloat(getComputedStyle(el).lineHeight) || 20;
    const cursorY = linesBefore * lineHeight;
    const visibleTop = el.scrollTop;
    const visibleBottom = el.scrollTop + 400;
    if (cursorY < visibleTop || cursorY > visibleBottom) {
        el.scrollTop = cursorY - 200;  // 游標放在可視區上方 1/3 處
    }
}
 
// ===== 语音输入 =====
let recognition = null;
let isListening = false;
let voiceDebounceTimer = null;
let lastVoiceText = '';   // 防重：擋同一段文字被寫入兩次
let finalConfirmed = false; // 標記：final 已確認，停止 interim 直到下一個 final
 
function startVoiceInput() {
    const btn = document.getElementById('voiceBtn');
 
    // 检查浏览器支持
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert('您的瀏覽器不支援語音輸入，請使用 Chrome 或 Safari');
        return;
    }
 
    // 停止录音
    if (isListening && recognition) {
        recognition.stop();
        recognition = null;
        isListening = false;
        btn.textContent = '🎤 語音輸入';
        btn.style.background = '#667eea';
        if (voiceDebounceTimer) clearTimeout(voiceDebounceTimer);
        lastVoiceText = '';
        return;
    }
 
    // 开始录音
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = 'zh-TW';
    recognition.continuous = false;      // ❌ 關閉連續聆聽：一句話說完自動停麥，用戶要查下一個時手動再按
    recognition.interimResults = true;    // 开启实时结果，加快响应
    recognition.maxAlternatives = 1;     // 只返回最佳结果，减少计算
 
    recognition.onresult = event => {
        const textarea = document.getElementById('input');
 
        for (let i = event.resultIndex; i < event.results.length; i++) {
            const text = event.results[i][0].transcript.trim();
 
            // =========================================================
            // 【語音直送模式】每收到一個最終結果就寫入 textarea
            // =========================================================
            if (event.results[i].isFinal) {
                finalConfirmed = true;
                if (text.length < 1) continue;
                // ✅ final 到達，立刻殺掉排隊中的 interim debounce
                if (voiceDebounceTimer) { clearTimeout(voiceDebounceTimer); voiceDebounceTimer = null; }
 
                // ===== 自動比對資料庫校正 =====
                const rawText = text.replace(/[，。、！？\s]/g, '');
                const matched = smartMatchProduct(rawText);
                const finalText = matched || rawText;
 
                // ✅ 移除 interim 可能已寫入的臨時行（最後一行若為 interim 遺留），再寫入 final
                let currentText = textarea.value.trim();
                if (currentText) {
                    const lines = currentText.split('\n');
                    const lastLine = lines[lines.length - 1];
                    // 如果最後一行跟 rawText 相似（interim 遺留），移除它
                    const cleanLast = lastLine.replace(/[，。、！？\s]/g, '');
                    if (cleanLast && (rawText.includes(cleanLast) || cleanLast.includes(rawText))) {
                        lines.pop();
                        currentText = lines.join('\n');
                    }
                }
                textarea.value = currentText + (currentText ? '\n' : '') + finalText;
                lastVoiceText = rawText;
 
                // 若有校正，靜默處理（debug log 已移除）
 
                // ✅ 語音寫入後顯示候選單，讓用戶選擇（不自動查詢）
                const lines = textarea.value.split('\n');
                const currentLine = lines[lines.length - 1].trim();
                const cleanLine = currentLine.replace(/[\s\*\-+xX/]*[\d瓶罐包盒顆粒]+$/, '').trim();
                if (cleanLine.length >= 1 && Object.keys(DB_KZ).length > 0) {
                    showAutocompleteSuggestions(cleanLine);
                }
                continue;
            }
 
            // 👈 final 確認後，跳過 interim，直到下一個 final 重新開始
            if (finalConfirmed) continue;
 
            if (!event.results[i].isFinal && text.length >= 1) {
                // 防抖：每次中間結果進來都重設計時器，300ms 後才處理
                if (voiceDebounceTimer) clearTimeout(voiceDebounceTimer);
                voiceDebounceTimer = setTimeout(() => {
                    // ✅ 防重：若 final 已到達，放棄此 interim debounce
                    if (finalConfirmed) return;
                    const cleanedText = text.replace(/[，。、！？\s]/g, '');
                    // 防重：若與 lastVoiceText 相同，跳過
                    if (cleanedText === lastVoiceText) return;
                    // 寫入最後一行
                    const currentText = textarea.value.split('\n').slice(0, -1).join('\n');
                    textarea.value = currentText + (currentText ? '\n' : '') + cleanedText;
                    // ❌ interim 也不顯示 autocomplete，避免任何自動查詢可能
                    const lines = textarea.value.split('\n');
                    const currentLine = lines[lines.length - 1].trim();
                    const cleanLine = currentLine.replace(/[\s\*\-+xX/]*[\d瓶罐包盒顆粒]+$/, '').trim();
                    // ✅ interim 也顯示候選單
                    if (cleanLine.length >= 1 && Object.keys(DB_KZ).length > 0) {
                        showAutocompleteSuggestions(cleanLine);
                    }
                }, 300);
            }
        }
    };
 
    recognition.onerror = event => {
        console.error('语音识别错误:', event.error);
        if (event.error === 'not-allowed') {
            alert('請允許麥克風權限');
        }
    };
 
    recognition.onend = () => {
        // ❌ continuous=false：一句話說完自動停麥，不自動重啟
        // 狀態重置，下次要查時用戶手動再按按鈕
        isListening = false;
        finalConfirmed = false;
        if (voiceDebounceTimer) clearTimeout(voiceDebounceTimer);
        btn.textContent = '🎤 語音輸入';
        btn.style.background = '#667eea';
    };
 
    finalConfirmed = false;
    recognition.start();
    isListening = true;
    btn.textContent = '🔴 停止聆聽';
    btn.style.background = '#dc3545';
}
 
// 智能匹配产品（用于语音和图片输入）
function smartMatchProduct(text) {
    if (!text || text.length < 2) return null;

    // 清理文本
    const cleanedText = text.replace(/[^\u4e00-\u9fa50-9]/g, '');
    if (!cleanedText) return null;

    // 提取数量
    const numMatch = cleanedText.match(/(\d+)$/);
    const qty = numMatch ? numMatch[1] : '';
    const productName = numMatch ? cleanedText.slice(0, -numMatch[1].length) : cleanedText;
    const query = normalizeSearchText(productName);

    // V2 統一搜尋（與查詢按鈕、自動補全同一引擎）
    const match = findBestMatchV2(query);
    if (match && match.multiCandidate) {
        return null;
    }
    if (match && match.name) {
        return match.name + qty;
    }

    return null;
}
